name: Build

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: rm -f package-lock.json && npm install

      - run: npm run build && rm -f .output/nitro.json

      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: .output/**
